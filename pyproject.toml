[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortxt-resilient-inference"
version = "0.1.0"
description = "Policy-gated fallback execution for provider-neutral inference"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cortxt-resilient-run = "cortxt_resilient_inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
