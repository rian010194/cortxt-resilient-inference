[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortxt-resilient-inference"
version = "0.2.0"
description = "Policy-gated fallback execution for provider-neutral inference"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

[project.urls]
Homepage = "https://github.com/rian010194/cortxt-resilient-inference"
Issues = "https://github.com/rian010194/cortxt-resilient-inference/issues"

[project.scripts]
cortxt-resilient-run = "cortxt_resilient_inference.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
